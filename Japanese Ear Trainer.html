<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japanese Ear Trainer</title>
<style>
:root{--bg:#eef2f7;--fg:#12223a;--muted:#5a6a82;--card:#fff;--line:#d3dbe8;--accent:#3b4cca;--accent-fg:#fff;--hl:#f2b705;--ok:#15803d;--okbg:#d9f5e3;--bad:#b42318;--badbg:#fde4e1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--fg:#e8edf7;--muted:#97a6c0;--card:#18223a;--line:#2b3957;--accent:#8fa2ff;--accent-fg:#0f1626;--hl:#f7c948;--ok:#5ee08f;--okbg:#12301f;--bad:#ff8a80;--badbg:#3b1a1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1626;--fg:#e8edf7;--muted:#97a6c0;--card:#18223a;--line:#2b3957;--accent:#8fa2ff;--accent-fg:#0f1626;--hl:#f7c948;--ok:#5ee08f;--okbg:#12301f;--bad:#ff8a80;--badbg:#3b1a1a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.35rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.92rem}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.k,.kana span,.opt,.big,.w{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.tabs{display:flex;gap:8px;margin:16px 0}
.tab{flex:1;padding:10px;border-radius:999px;font-weight:600}
.tab.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.warn{background:var(--badbg);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:.9rem;margin-bottom:12px}
.hint{color:var(--muted);margin:8px 0 12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.kana{border-radius:10px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center}
.kana span{font-size:1.9rem;line-height:1.2}
.kana small{color:var(--muted);font-size:.78rem}
.kana.on{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.kana.on small{color:var(--accent-fg)}
.panel{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.panel .big{font-size:3rem;line-height:1}
.panel .w{font-size:1.5rem}
.panel > div:nth-child(2){flex:1}
.panel.good{border-color:var(--ok);background:var(--okbg);position:static}
.panel.miss{border-color:var(--bad);background:var(--badbg);position:static}
.ghost,.primary{border-radius:12px;padding:10px 14px;font-weight:600}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.wide{width:100%;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border-radius:999px;padding:4px 12px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:1.1rem}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.score{font-weight:600;margin-bottom:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.opt{font-size:3rem;line-height:1;padding:22px 0;border-radius:18px}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.hl{color:var(--hl);background:var(--fg);border-radius:6px;padding:0 4px;margin-right:2px;font-weight:700}
.sets,.modes{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.set,.mode{border-radius:999px;padding:5px 12px;font-size:.9rem}
.set.on,.mode.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.item{display:flex;align-items:center;gap:12px;text-align:left;border-radius:10px;padding:8px 12px}
.item .jp{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:1.25rem;min-width:4.5em}
.item small{color:var(--muted)}
.item.on{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.item.on small{color:var(--accent-fg)}
.opt.txt{font-family:inherit;font-size:1.05rem;line-height:1.3;padding:18px 8px}
.shown{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:3.6rem;line-height:1.1;text-align:center;margin:4px 0 12px}
</style>
</head>
<body>
<main>
<h1>Japanese Ear Trainer</h1>
<div class="sub">Hear it, read it, match it. Kana, katakana, words, and travel phrases.</div>
<div class="tabs"><button class="tab" data-tab="learn">Learn</button><button class="tab" data-tab="quiz">Quiz</button></div>
<div id="sets" class="sets"></div>
<div id="warn" class="warn" hidden>No Japanese voice found on this device, so you may hear nothing or the wrong accent. Add one in your device’s speech settings (on iPhone: Settings, Accessibility, Spoken Content, Voices).</div>
<div id="app"></div>
</main>
<script>
const RAW=`#

#

と|to|とり|tori|bird
#

ね|ne|ねこ|neko|cat
の|no|のり|nori|seaweed
#
は|ha|はな|hana|flower

へ|he|へや|heya|room

め|me|めがね|megane|glasses
も|mo|もり|mori|forest
#

ゆ|yu|ゆき|yuki|snow
よ|yo|よる|yoru|night
#
ら|ra|らくだ|rakuda|camel
り|ri|りんご|ringo|apple

#
ん|n|ほん|hon|book (ends in ん)|x
を|o|ほんをよむ|hon o yomu|read a book (を marks the object)|x`;
const DK=`#
が|ga|がいこく|gaikoku|foreign country
ぎ|gi|ぎんこう|ginkou|bank
ぐ|gu|ぐあい|guai|condition
げ|ge|げんき|genki|healthy, energetic
ご|go|ごはん|gohan|rice, meal
#
ざ|za|ざっし|zasshi|magazine
じ|ji|じてんしゃ|jitensha|bicycle
ず|zu|ずぼん|zubon|trousers
ぜ|ze|ぜんぶ|zenbu|everything
ぞ|zo|ぞう|zou|elephant
#
だ|da|だいがく|daigaku|university
で|de|でんしゃ|densha|train
ど|do|どうぶつ|doubutsu|animal
#
ば|ba|ばす|basu|bus
び|bi|びっくり|bikkuri|surprise

べ|be|べんとう|bentou|boxed lunch
ぼ|bo|ぼうし|boushi|hat
#
ぱ|pa|ぱん|pan|bread
ぴ|pi|ぴあの|piano|piano
ぷ|pu|ぷりん|purin|pudding
ぺ|pe|ぺん|pen|pen
ぽ|po|ぽけっと|poketto|pocket`;
const CB=`#
きゃ|kya|きゃく|kyaku|guest
きゅ|kyu|きゅう|kyuu|nine
きょ|kyo|きょう|kyou|today
#
しゃ|sha|しゃしん|shashin|photo
しゅ|shu|しゅくだい|shukudai|homework
しょ|sho|しょくじ|shokuji|meal
#
ちゃ|cha|ちゃいろ|chairo|brown
ちゅ|chu|ちゅうごく|chuugoku|China
ちょ|cho|ちょうちょ|chouchou|butterfly
#
にゅ|nyu|にゅうがく|nyuugaku|entering school
ひゃ|hya|ひゃく|hyaku|one hundred
ひょ|hyo|ひょうじょう|hyoujou|facial expression
みょ|myo|みょうじ|myouji|family name
りゃ|rya|りゃく|ryaku|abbreviation
りゅ|ryu|りゅうがく|ryuugaku|studying abroad
りょ|ryo|りょこう|ryokou|travel
#
ぎゃ|gya|ぎゃく|gyaku|opposite
ぎゅ|gyu|ぎゅうにゅう|gyuunyuu|milk
ぎょ|gyo|ぎょうざ|gyouza|dumplings
じゃ|ja|じゃがいも|jagaimo|potato
じゅ|ju|じゅぎょう|jugyou|class
じょ|jo|じょうず|jouzu|skilled
びょ|byo|びょういん|byouin|hospital`;
const KX=`#
シャ|sha|シャツ||shirt
シュ|shu|シュークリーム||cream puff
ショ|sho|ショップ||shop
キャ|kya|キャベツ||cabbage
#
チャ|cha|チャンス||chance
チュ|chu|チューリップ||tulip
チョ|cho|チョコ||chocolate
ニュ|nyu|ニュース||news
ミュ|myu|ミュージック||music
#
ジャ|ja|ジャム||jam
ジュ|ju|ジュース||juice
ジョ|jo|ジョギング||jogging
#
ファ|fa|ファン||fan
フィ|fi|フィルム||film
フェ|fe|フェリー||ferry
フォ|fo|フォーク||fork
#
ティ|ti|ティー||tea
ディ|di|ディズニー||Disney
ウィ|wi|ウィンドウ||window
ウェ|we|ウェブ||web
ウォ|wo|ウォッチ||watch
#
チェ|che|チェック||check
シェ|she|シェア||share
ジェ|je|ジェット||jet`;
const KB=`アイス ice cream
イヤホン earphones
ウイルス virus
エアコン air conditioner
オムレツ omelet
カメラ camera
キウイ kiwi
クッキー cookie
ケーキ cake

シチュー stew

ニット knitwear

ホテル hotel

メール email
モデル model
ヤンキー Yankee (slang for a delinquent)
ユーモア humor
ヨガ yoga
ラーメン ramen
リモコン remote control
ルール rule
レモン lemon
ロボット robot
ワイン wine
パン bread (ends in ン)
ヲタク otaku (rare spelling)`;
const KD=`ガム gum
ギター guitar
グラス glass
ゲーム game
ゴルフ golf

const WD=`# Kanji
ひ|hi|day, sun|日
つき|tsuki|moon, month|月
ひと|hito|person|人
やま|yama|mountain|山
かわ|kawa|river|川
みず|mizu|water|水
ひ|hi|fire|火
おおきい|ookii|big|大きい
ちいさい|chiisai|small|小さい
# Everyday words
たべる|taberu|to eat|食べる
のむ|nomu|to drink|飲む
いく|iku|to go|行く
くる|kuru|to come|来る
みる|miru|to see, watch|見る
きく|kiku|to listen, ask|聞く
はなす|hanasu|to speak|話す
ともだち|tomodachi|friend|友達
がっこう|gakkou|school|学校
にほん|nihon|Japan|日本
にほんご|nihongo|Japanese language|日本語
せんせい|sensei|teacher|先生`;
const TR=`# Greetings
こんにちは|konnichiwa|hello
おはようございます|ohayou gozaimasu|good morning
こんばんは|konbanwa|good evening
さようなら|sayounara|goodbye
ありがとう|arigatou|thank you
どういたしまして|dou itashimashite|you’re welcome
すみません|sumimasen|excuse me, sorry
ごめんなさい|gomennasai|I’m sorry
はい|hai|yes
いいえ|iie|no
いただきます|itadakimasu|said before eating
ごちそうさまでした|gochisousama deshita|said after eating
# On the go
これをください|kore o kudasai|this one, please
いくらですか|ikura desu ka|how much is it?
トイレはどこですか|toire wa doko desu ka|where is the restroom?
えきはどこですか|eki wa doko desu ka|where is the station?|駅はどこですか
わかりません|wakarimasen|I don’t understand
えいごをはなせますか|eigo o hanasemasu ka|do you speak English?|英語を話せますか
もういちどおねがいします|mou ichido onegaishimasu|once more, please|もう一度お願いします
みずをください|mizu o kudasai|water, please|水をください
おいしい|oishii|delicious
おすすめはなんですか|osusume wa nan desu ka|what do you recommend?
おかいけいおねがいします|okaikei onegaishimasu|the check, please|お会計お願いします
たすけて|tasukete|help!`;
const NM=`# 1 to 10
いち|ichi|1|一
に|ni|2|二
さん|san|3|三
よん|yon|4|四
ご|go|5|五
ろく|roku|6|六
なな|nana|7|七
はち|hachi|8|八
きゅう|kyuu|9|九
じゅう|juu|10|十
# Bigger
ひゃく|hyaku|100|百
せん|sen|1,000|千
まん|man|10,000|万`;
const parse=raw=>{const rows=[];raw.split("\n").forEach(l=>{if(l[0]==="#"){rows.push([]);return}const[k,r,w,wr,m,x]=l.split("|");rows[rows.length-1].push({k,r,w,wr,m,x})});return rows};
const vparse=raw=>{const rows=[];raw.split("\n").forEach(l=>{if(l[0]==="#"){const r=[];r.name=l.slice(2);rows.push(r);return}const[w,wr,m,k]=l.split("|");rows[rows.length-1].push({k:k||w,r:wr,w,wr,m})});return rows};
const kata=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));
const kset=(rows,words)=>{let i=0;return rows.map(r=>r.map(o=>{const p=words[i++],s=p.indexOf(" ");return{k:kata(o.k),r:o.r,w:p.slice(0,s),wr:"",m:p.slice(s+1),x:o.x}}))};
const HB=parse(RAW),HD=parse(DK);
const SETS=[{n:"Hiragana",rows:HB},{n:"Voiced",rows:HD},{n:"Combos",rows:parse(CB)},{n:"Katakana",rows:kset(HB,KB.split("\n"))},{n:"Katakana voiced",rows:kset(HD,KD.split("\n"))},{n:"Katakana extra",rows:parse(KX)},{n:"Words",v:1,rows:vparse(WD)},{n:"Travel",v:1,rows:vparse(TR)},{n:"Numbers",v:1,rows:vparse(NM)}];
let ROWS=SETS[0].rows,ALL=ROWS.flat();
const S=()=>SETS[si];
const gl=o=>o.wr?o.wr+", "+o.m:o.m;
const lab=o=>S().v?o.m:mode==="read"?o.r:o.k;
const hl=a=>{const i=Math.max(0,a.w.indexOf(a.k));return a.w.slice(0,i)+'<span class="hl">'+a.k+"</span>"+a.w.slice(i+a.k.length)};
const hint=()=>S().v?(mode==="read"?"What does this mean?":"Listen, then pick what it means."):(mode==="read"?"What sound does this character make?":"Listen to the word, then pick the kana it starts with.");
function setSet(i){si=i;ROWS=SETS[i].rows;ALL=ROWS.flat();sel=new Set([0]);focus=null;q=null;last=null;if(tab==="quiz")next();else render()}

const $=s=>document.querySelector(s);
let si=0,mode="listen",tab="learn",sel=new Set([0,1]),focus=null,q=null,picked=null,right=0,total=0,last=null,voice=null;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hasTTS="speechSynthesis" in window;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>x.lang.replace("_","-").toLowerCase().startsWith("ja"))||null;$("#warn").hidden=!(v.length&&!voice)}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}else{$("#warn").hidden=false}
function say(t){if(!hasTTS)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function next(){
 let pool=[...sel].flatMap(i=>ROWS[i]);if(mode==="listen"){const p=pool.filter(o=>!o.x);if(p.length)pool=p;else mode="read"}
 let a=rnd(pool);if(pool.length>1)while(a===last)a=rnd(pool);
 last=a;
 let d=shuffle(pool.filter(x=>x!==a)).slice(0,3);
 if(d.length<3)d=d.concat(shuffle(ALL.filter(x=>x!==a&&!d.includes(x))).slice(0,3-d.length));
 q={a,opts:shuffle([a,...d])};picked=null;render();say(a.w);
}
function learn(){
 let h='<p class="hint">'+(S().v?"Tap a word to hear it.":"Tap a character to hear a real word that starts with it.")+"</p>";
 if(focus)h+=`<div class="panel"><div class="big"${focus.k.length>2?' style="font-size:1.6rem"':""}>${focus.k}</div><div><div class="w">${focus.w}</div><div class="sub">${gl(focus)}</div></div><button class="ghost" data-act="again">Replay</button></div>`;
 ROWS.forEach(r=>{if(r.name)h+=`<div class="sub" style="margin:10px 0 4px">${r.name}</div>`;if(S().v){h+='<div class="list">'+r.map(o=>`<button class="item${focus===o?" on":""}" data-k="${o.k}"><span class="jp">${o.k}</span><span>${o.m}<br><small>${o.wr}</small></span></button>`).join("")+"</div>";return}h+='<div class="grid">'+r.map(o=>`<button class="kana${focus===o?" on":""}" data-k="${o.k}"><span>${o.k}</span><small>${o.r}</small></button>`).join("")+"</div>"});
 return h;
}
function quiz(){
 let h='<div class="modes"><button class="mode${mode==="listen"?" on":""}" data-mode="listen">Listen</button><button class="mode${mode==="read"?" on":""}" data-mode="read">Read</button></div><div class="sub" style="margin-bottom:6px">Practice</div><div class="chips">'+ROWS.map((r,i)=>`<button class="chip${sel.has(i)?" on":""}" data-row="${i}">${r.name||r[0].k}</button>`).join("")+"</div>";
 h+=`<div class="score">Score: ${right} of ${total}</div><p class="hint">${hint()}</p>${mode==="read"?`<div class="shown">${q.a.k}</div>`:""}<button class="ghost wide" data-act="again">Hear it${mode==="listen"?" again":""}</button><div class="opts">`;
 h+=q.opts.map(o=>{let c=S().v||mode==="read"?"opt txt":"opt";if(picked){if(o===q.a)c+=" ok";else if(o===picked)c+=" bad"}return`<button class="${c}" data-opt="${o.k}"${picked?" disabled":""}>${lab(o)}</button>`}).join("")+"</div>";
 if(picked){const a=q.a,good=picked===a;h+=`<div class="panel ${good?"good":"miss"}"><div><div class="w">${S().v?a.w:hl(a)}</div><div class="sub">${gl(a)}</div><div>${good?"Correct.":S().v?"It means "+a.m+".":"It is "+a.k+" ("+a.r+")."}</div></div></div><button class="primary wide" data-act="next">Next word</button>`}
 return h;
}
function render(){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
 $("#sets").innerHTML=SETS.map((s,i)=>`<button class="set${i===si?" on":""}" data-set="${i}">${s.n}</button>`).join("");$("#app").innerHTML=tab==="learn"?learn():quiz();
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 const d=t.dataset;
 if(d.tab){tab=d.tab;if(tab==="quiz"&&!q)next();else render()}
 else if(d.k){focus=ALL.find(o=>o.k===d.k);say(focus.w);render()}
 else if(d.act==="again"){const o=tab==="learn"?focus:q.a;if(o)say(o.w)}
 else if(d.act==="next")next();else if(d.set!==undefined)setSet(+d.set);else if(d.mode){mode=d.mode;next()}
 else if(d.row!==undefined){const i=+d.row;sel.has(i)?sel.delete(i):sel.add(i);if(!sel.size)sel.add(i);next()}
 else if(d.opt){if(picked)return;picked=q.opts.find(o=>o.k===d.opt);total++;if(picked===q.a)right++;render();if(mode==="read")say(q.a.w)}
